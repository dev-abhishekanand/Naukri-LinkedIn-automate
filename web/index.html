<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Job Automation & Diagnostics Command Center | Abhishek Anand</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- React 18, ReactDOM, and Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>

  <style>
    body { background-color: #0b0f19; color: #f3f4f6; }
    .glass-card {
      background: rgba(17, 24, 39, 0.75);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card:hover {
      border-color: rgba(99, 102, 241, 0.3);
    }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.4); border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.7); }
    .pulse-dot {
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.7);
    }
    .pulse-red {
      box-shadow: 0 0 10px rgba(244, 63, 94, 0.7);
    }
    .stepper-active {
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.5);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans selection:bg-brand-500 selection:text-white">

  <!-- React Root Container -->
  <div id="root"></div>

  <!-- React Application Source Code -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      // Phase 3 Tabs: 'hub', 'ai', 'direct', 'sheets', 'ledger'
      const [activeTab, setActiveTab] = useState('hub');
      const [statusData, setStatusData] = useState(null);
      const [diagData, setDiagData] = useState(null);
      const [runStatus, setRunStatus] = useState({ is_running: false, logs: [] });
      const [sheetsData, setSheetsData] = useState(null);
      const [loadingSheets, setLoadingSheets] = useState(false);
      const [interviewQuestions, setInterviewQuestions] = useState([]);
      const [meetingsData, setMeetingsData] = useState([]);
      const [logModal, setLogModal] = useState({ open: false, title: '', content: '' });
      const [reloginModal, setReloginModal] = useState({ open: false, site: '', command: '' });

      // Battery-Saving Eco State ('auto', 'fast', 'paused')
      const [ecoMode, setEcoMode] = useState('auto');
      const [serverConnected, setServerConnected] = useState(true);
      const isRunningRef = useRef(false);
      isRunningRef.current = runStatus?.is_running || false;

      // Smart Battery-Aware Adaptive Poller with Tab Invisibility Sleep
      useEffect(() => {
        let timer = null;

        const fetchAll = async () => {
          if (document.hidden || ecoMode === 'paused') {
            return;
          }
          try {
            const promises = [fetch('/api/status').then(r => r.json()).catch(() => null)];
            if (isRunningRef.current || ecoMode === 'fast') {
              promises.push(fetch('/api/run-status').then(r => r.json()).catch(() => null));
            }
            promises.push(fetch('/api/diagnostics').then(r => r.json()).catch(() => null));

            const [sRes, rRes, dRes] = await Promise.all(promises);
            if (sRes) {
              setStatusData(sRes);
              setServerConnected(true);
            } else {
              setServerConnected(false);
            }
            if (rRes) setRunStatus(rRes);
            if (dRes) setDiagData(dRes);
          } catch (e) {
            setServerConnected(false);
            console.error("Poll error:", e);
          }
        };

        const scheduleNext = () => {
          if (timer) clearTimeout(timer);
          if (document.hidden || ecoMode === 'paused') {
            return;
          }
          let delay = 15000;
          if (isRunningRef.current) {
            delay = 2500;
          } else if (ecoMode === 'fast') {
            delay = 3000;
          } else if (statusData?.power_status?.is_on_battery) {
            delay = 20000; // Extra conservation on battery
          } else {
            delay = 12000;
          }

          timer = setTimeout(async () => {
            await fetchAll();
            scheduleNext();
          }, delay);
        };

        const onVisibilityChange = () => {
          if (!document.hidden) {
            fetchAll();
            scheduleNext();
          } else {
            if (timer) clearTimeout(timer);
          }
        };

        document.addEventListener('visibilitychange', onVisibilityChange);
        fetchAll();
        scheduleNext();

        return () => {
          document.removeEventListener('visibilitychange', onVisibilityChange);
          if (timer) clearTimeout(timer);
        };
      }, [ecoMode, runStatus.is_running]);

      // Fetch Google Sheets when tab is opened
      useEffect(() => {
        if (activeTab === 'sheets' && !sheetsData) {
          loadSheetsData();
        }
      }, [activeTab]);

      // Fetch Interview Prep questions & Recruiter Meetings for Hub
      useEffect(() => {
        fetch('/api/interview-prep')
          .then(r => r.json())
          .then(d => {
            if (d.success) setInterviewQuestions(d.data || []);
          })
          .catch(() => {});

        fetch('/api/recruiter-meetings')
          .then(r => r.json())
          .then(d => {
            if (d.success && d.meetings) setMeetingsData(d.meetings);
          })
          .catch(() => {});
      }, []);

      const loadSheetsData = async () => {
        setLoadingSheets(true);
        try {
          const res = await fetch('/api/google-sheets/jobs');
          const data = await res.json();
          setSheetsData(data);
        } catch (e) {
          console.error(e);
        } finally {
          setLoadingSheets(false);
        }
      };

      const viewLog = async (logName) => {
        try {
          const res = await fetch(`/api/log?name=${encodeURIComponent(logName)}`);
          const text = await res.text();
          setLogModal({ open: true, title: logName, content: text });
        } catch (e) {
          alert("Could not load log: " + e);
        }
      };

      const openRelogin = (site) => {
        const cleanSite = (site || 'naukri').toLowerCase();
        setReloginModal({
          open: true,
          site: cleanSite.toUpperCase(),
          portalKey: cleanSite,
          command: `python3 login_capture.py ${cleanSite}`
        });
      };

      const metrics = statusData?.all_metrics || {};

      return (
        <div className="flex-1 flex flex-col min-h-screen">
          {/* Top Header */}
          <header className="border-b border-white/10 bg-slate-950/90 backdrop-blur-md sticky top-0 z-40 px-6 py-3.5">
            <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-400 flex items-center justify-center font-bold text-white shadow-lg shadow-brand-500/20 text-lg">
                  AA
                </div>
                <div>
                  <div className="flex items-center gap-2 flex-wrap">
                    <h1 className="font-bold text-base text-white tracking-tight">Abhishek Anand</h1>
                    <span className={`text-xs px-2 py-0.5 rounded-full border flex items-center gap-1 font-medium ${
                      serverConnected
                        ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20'
                        : 'bg-rose-500/10 text-rose-400 border-rose-500/20'
                    }`}>
                      <span className={`w-1.5 h-1.5 rounded-full ${serverConnected ? 'bg-emerald-400 animate-pulse pulse-dot' : 'bg-rose-400'}`}></span>
                      {serverConnected ? 'Real-Time Active' : 'Offline / Reconnecting'}
                    </span>

                    {/* Live Battery & Hardware Power Status */}
                    {statusData?.power_status && (
                      <span className={`text-[11px] px-2.5 py-0.5 rounded-full border flex items-center gap-1 font-mono ${
                        statusData.power_status.is_on_battery
                          ? (statusData.power_status.battery_percent <= 30 ? 'bg-amber-950/40 text-amber-300 border-amber-500/40' : 'bg-blue-950/40 text-blue-300 border-blue-500/40')
                          : 'bg-emerald-950/40 text-emerald-300 border-emerald-500/40'
                      }`} title={statusData.power_status.time_remaining ? `${statusData.power_status.time_remaining} remaining` : 'AC Power'}>
                        <span>{statusData.power_status.is_on_battery ? '🔋' : '⚡'}</span>
                        <span>{statusData.power_status.power_source} ({statusData.power_status.battery_percent}%)</span>
                        {statusData.power_status.should_throttle && <span className="text-[10px] text-amber-400">· Eco-Throttled</span>}
                      </span>
                    )}

                    {/* Eco-Mode Polling Mode Toggle */}
                    <button onClick={() => setEcoMode(ecoMode === 'auto' ? 'fast' : (ecoMode === 'fast' ? 'paused' : 'auto'))} className={`text-[11px] px-2.5 py-0.5 rounded-full border font-mono transition ${
                      ecoMode === 'auto' ? 'bg-indigo-950/40 text-indigo-300 border-indigo-500/40 hover:bg-indigo-900/40' :
                      ecoMode === 'fast' ? 'bg-emerald-950/40 text-emerald-300 border-emerald-500/40 hover:bg-emerald-900/40' :
                      'bg-rose-950/40 text-rose-300 border-rose-500/40 hover:bg-rose-900/40'
                    }`} title="Click to cycle: Auto Eco (15s) -> Fast (2.5s) -> Paused">
                      <span>{ecoMode === 'auto' ? '🌱 Auto Eco' : (ecoMode === 'fast' ? '⚡ Fast (2.5s)' : '⏸️ Polling Paused')}</span>
                    </button>

                    {/* Operational Phase & Night Silence Indicator */}
                    {statusData?.operational_window && (
                      <span className={`text-[11px] px-2.5 py-0.5 rounded-full border flex items-center gap-1 font-mono ${
                        statusData.operational_window.is_silent
                          ? 'bg-purple-950/40 text-purple-300 border-purple-500/40 animate-pulse'
                          : 'bg-indigo-950/40 text-indigo-300 border-indigo-500/40'
                      }`} title={statusData.operational_window.desc}>
                        <span>{statusData.operational_window.label}</span>
                      </span>
                    )}
                  </div>
                  <p className="text-xs text-slate-400 font-mono mt-0.5">React / Frontend Engineer (3.5+ Yrs) · 0 Days Notice (Immediate) · Patna / Remote</p>
                </div>
              </div>

              {/* Portal Session Badges */}
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-semibold text-slate-400 mr-1">Sessions:</span>
                {statusData?.sessions ? (
                  <>
                    <button onClick={() => openRelogin('naukri')} title="Click to view or re-login" className={`px-2.5 py-1 rounded-lg text-xs font-mono font-medium border flex items-center gap-1.5 transition ${statusData.sessions.naukri_primary ? 'bg-emerald-950/30 text-emerald-300 border-emerald-500/30 hover:bg-emerald-900/40' : 'bg-rose-950/40 text-rose-300 border-rose-500/40 hover:bg-rose-900/50'}`}>
                      <span className={`w-1.5 h-1.5 rounded-full ${statusData.sessions.naukri_primary ? 'bg-emerald-400' : 'bg-rose-400'}`}></span>
                      Naukri P1 {statusData.sessions.naukri_primary ? '✓' : '⚠️ Login'}
                    </button>
                    <button onClick={() => openRelogin('naukri_secondary')} title="Click to view or re-login" className={`px-2.5 py-1 rounded-lg text-xs font-mono font-medium border flex items-center gap-1.5 transition ${statusData.sessions.naukri_secondary ? 'bg-emerald-950/30 text-emerald-300 border-emerald-500/30 hover:bg-emerald-900/40' : 'bg-rose-950/40 text-rose-300 border-rose-500/40 hover:bg-rose-900/50'}`}>
                      <span className={`w-1.5 h-1.5 rounded-full ${statusData.sessions.naukri_secondary ? 'bg-emerald-400' : 'bg-rose-400'}`}></span>
                      Naukri P2 {statusData.sessions.naukri_secondary ? '✓' : '⚠️ Login'}
                    </button>
                    <button onClick={() => openRelogin('linkedin')} title="Click to view or re-login" className={`px-2.5 py-1 rounded-lg text-xs font-mono font-medium border flex items-center gap-1.5 transition ${statusData.sessions.linkedin ? 'bg-emerald-950/30 text-emerald-300 border-emerald-500/30 hover:bg-emerald-900/40' : 'bg-rose-950/40 text-rose-300 border-rose-500/40 hover:bg-rose-900/50'}`}>
                      <span className={`w-1.5 h-1.5 rounded-full ${statusData.sessions.linkedin ? 'bg-emerald-400' : 'bg-rose-400'}`}></span>
                      LinkedIn {statusData.sessions.linkedin ? '✓' : '⚠️ Login'}
                    </button>
                    <button onClick={() => openRelogin('instahyre')} title="Click to view or re-login" className={`px-2.5 py-1 rounded-lg text-xs font-mono font-medium border flex items-center gap-1.5 transition ${statusData.sessions.instahyre ? 'bg-emerald-950/30 text-emerald-300 border-emerald-500/30 hover:bg-emerald-900/40' : 'bg-rose-950/40 text-rose-300 border-rose-500/40 hover:bg-rose-900/50'}`}>
                      <span className={`w-1.5 h-1.5 rounded-full ${statusData.sessions.instahyre ? 'bg-emerald-400' : 'bg-rose-400'}`}></span>
                      Instahyre {statusData.sessions.instahyre ? '✓' : '⚠️ Login'}
                    </button>
                    <button onClick={() => openRelogin('cutshort')} title="Click to view or re-login" className={`px-2.5 py-1 rounded-lg text-xs font-mono font-medium border flex items-center gap-1.5 transition ${statusData.sessions.cutshort ? 'bg-emerald-950/30 text-emerald-300 border-emerald-500/30 hover:bg-emerald-900/40' : 'bg-rose-950/40 text-rose-300 border-rose-500/40 hover:bg-rose-900/50'}`}>
                      <span className={`w-1.5 h-1.5 rounded-full ${statusData.sessions.cutshort ? 'bg-emerald-400' : 'bg-rose-400'}`}></span>
                      Cutshort {statusData.sessions.cutshort ? '✓' : '⚠️ Login'}
                    </button>
                    <button onClick={() => openRelogin('wellfound')} title="Click to view or re-login" className={`px-2.5 py-1 rounded-lg text-xs font-mono font-medium border flex items-center gap-1.5 transition ${statusData.sessions.wellfound ? 'bg-emerald-950/30 text-emerald-300 border-emerald-500/30 hover:bg-emerald-900/40' : 'bg-rose-950/40 text-rose-300 border-rose-500/40 hover:bg-rose-900/50'}`}>
                      <span className={`w-1.5 h-1.5 rounded-full ${statusData.sessions.wellfound ? 'bg-emerald-400' : 'bg-rose-400'}`}></span>
                      Wellfound {statusData.sessions.wellfound ? '✓' : '⚠️ Login'}
                    </button>
                    <button onClick={() => openRelogin('hirist')} title="Click to view or re-login" className={`px-2.5 py-1 rounded-lg text-xs font-mono font-medium border flex items-center gap-1.5 transition ${statusData.sessions.hirist ? 'bg-emerald-950/30 text-emerald-300 border-emerald-500/30 hover:bg-emerald-900/40' : 'bg-rose-950/40 text-rose-300 border-rose-500/40 hover:bg-rose-900/50'}`}>
                      <span className={`w-1.5 h-1.5 rounded-full ${statusData.sessions.hirist ? 'bg-emerald-400' : 'bg-rose-400'}`}></span>
                      Hirist {statusData.sessions.hirist ? '✓' : '⚠️ Login'}
                    </button>
                    <button onClick={() => openRelogin('indeed')} title="Click to view or re-login" className={`px-2.5 py-1 rounded-lg text-xs font-mono font-medium border flex items-center gap-1.5 transition ${statusData.sessions.indeed ? 'bg-emerald-950/30 text-emerald-300 border-emerald-500/30 hover:bg-emerald-900/40' : 'bg-rose-950/40 text-rose-300 border-rose-500/40 hover:bg-rose-900/50'}`}>
                      <span className={`w-1.5 h-1.5 rounded-full ${statusData.sessions.indeed ? 'bg-emerald-400' : 'bg-rose-400'}`}></span>
                      Indeed {statusData.sessions.indeed ? '✓' : '⚠️ Login'}
                    </button>
                    <button
                      onClick={async () => {
                        if (confirm("⚠️ Clear all existing sessions and log in fresh to all portals?")) {
                          const res = await fetch('/api/session/reset', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ portal: 'all' })
                          });
                          const d = await res.json();
                          alert(d.message || "All sessions cleared!");
                          window.location.reload();
                        }
                      }}
                      title="Archive and clear all sessions to start fresh"
                      className="px-2 py-1 rounded-lg text-xs bg-rose-950/80 text-rose-300 border border-rose-500/50 hover:bg-rose-900 font-semibold"
                    >
                      🧹 Clear All
                    </button>
                  </>
                ) : (
                  <span className="text-xs text-slate-500">Checking sessions...</span>
                )}
              </div>
            </div>

            {/* DELIVERABLE 1: TOP METRICS BAR (Live Real-Time Counters) */}
            <div className="max-w-7xl mx-auto mt-3.5 pt-3 border-t border-white/10 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
              {/* Counter 1: Applied Today (Multi-Portal Transparent Breakdown) */}
              <div className="glass-card px-3.5 py-2.5 rounded-xl border border-emerald-500/30 bg-emerald-950/20 flex items-center justify-between col-span-1 lg:col-span-1">
                <div className="w-full">
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-1.5">
                      <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                      <span className="text-[11px] font-semibold text-slate-300">🎯 Applied Today</span>
                    </div>
                    <span className="text-[10px] px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 font-mono">Real-Time</span>
                  </div>
                  <div className="text-xl font-extrabold text-emerald-400 mt-0.5">
                    {metrics.today?.applied_total ?? 0} Applications
                  </div>
                  <div className="text-[10px] text-slate-300 font-mono mt-1 grid grid-cols-4 gap-1">
                    <span>Naukri: <strong>{((metrics.today?.by_portal?.naukri_primary || 0) + (metrics.today?.by_portal?.naukri_secondary || 0))}</strong></span>
                    <span>LinkedIn: <strong>{metrics.today?.by_portal?.linkedin || 0}</strong></span>
                    <span>Indeed: <strong>{metrics.today?.by_portal?.indeed || 0}</strong></span>
                    <span>Instahyre: <strong>{metrics.today?.by_portal?.instahyre || 0}</strong></span>
                    <span>Cutshort: <strong>{metrics.today?.by_portal?.cutshort || 0}</strong></span>
                    <span>Wellfound: <strong>{metrics.today?.by_portal?.wellfound || 0}</strong></span>
                    <span>Hirist: <strong>{metrics.today?.by_portal?.hirist || 0}</strong></span>
                    <span>ATS Sheet: <strong>{metrics.today?.by_portal?.universal_ats || 0}</strong></span>
                  </div>
                </div>
              </div>

              {/* Counter 2: LinkedIn Daily Post */}
              <div className="glass-card px-3.5 py-2.5 rounded-xl border border-indigo-500/30 bg-indigo-950/20 flex items-center justify-between">
                <div className="truncate mr-2">
                  <div className="flex items-center gap-1.5">
                    <span className="text-[11px] font-semibold text-slate-300">📰 LinkedIn Daily Post</span>
                    <span className={`text-[9px] px-1.5 py-0.2 rounded font-mono ${metrics.linkedin_post?.posted_today ? 'bg-emerald-500/20 text-emerald-300' : 'bg-amber-500/20 text-amber-300'}`}>
                      {metrics.linkedin_post?.posted_today ? '✓ Published' : '⏳ Scheduled'}
                    </span>
                  </div>
                  <div className="text-xs font-bold text-white mt-1 truncate max-w-[200px]" title={metrics.linkedin_post?.topic_title}>
                    {metrics.linkedin_post?.topic_title || 'How V8 Engine Optimizes Objects'}
                  </div>
                  <div className="text-[10px] text-slate-400 font-mono mt-0.5">
                    {metrics.linkedin_post?.lifetime_posts || 18} lifetime thought leadership posts
                  </div>
                </div>
                <a href={metrics.linkedin_post?.url || 'https://www.linkedin.com/in/abhishekanand7601/recent-activity/all/'} target="_blank" rel="noreferrer" className="text-xs px-2 py-1 rounded-lg bg-indigo-600/40 hover:bg-indigo-600 text-indigo-200 transition font-mono whitespace-nowrap">
                  View ↗
                </a>
              </div>

              {/* Counter 3: Google Sheets 'Apply Yourself' Queue */}
              <div className="glass-card px-3.5 py-2.5 rounded-xl border border-amber-500/30 bg-amber-950/20 flex items-center justify-between">
                <div>
                  <div className="flex items-center gap-1.5">
                    <span className="text-[11px] font-semibold text-slate-300">📊 Sheet Queue</span>
                  </div>
                  <div className="text-lg font-extrabold text-amber-400 mt-0.5">
                    {metrics.google_sheets?.pending ?? 0} Pending
                  </div>
                  <div className="text-[10px] text-slate-400 font-mono mt-0.5">
                    {metrics.google_sheets?.total ?? 0} Total · {metrics.google_sheets?.applied ?? 0} Applied · {metrics.google_sheets?.review_required ?? 0} Review
                  </div>
                </div>
                <button onClick={() => setActiveTab('sheets')} className="text-xs px-2 py-1 rounded-lg bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 font-mono">
                  Batch Run ⚡
                </button>
              </div>

              {/* Counter 4: 7-Day Algorithmic Views */}
              <div className="glass-card px-3.5 py-2.5 rounded-xl border border-cyan-500/30 bg-cyan-950/20 flex items-center justify-between">
                <div>
                  <div className="flex items-center gap-1.5">
                    <span className="text-[11px] font-semibold text-slate-300">👁️ 7-Day Visibility</span>
                  </div>
                  <div className="text-lg font-extrabold text-cyan-300 mt-0.5">
                    {metrics.visibility?.naukri_p1_searches ?? 86} Naukri · {metrics.visibility?.linkedin_views ?? 42} LI
                  </div>
                  <div className="text-[10px] text-slate-400 font-mono mt-0.5">
                    P2: {metrics.visibility?.naukri_p2_searches ?? 72} · LI Searches: {metrics.visibility?.linkedin_searches ?? 78} · Impr: {metrics.visibility?.post_impressions ?? 120}
                  </div>
                </div>
                <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-cyan-500/20 text-cyan-300 font-mono">Audit Baseline</span>
              </div>
            </div>

            {/* Navigation Tabs (5 Phase 3 Tabs) */}

            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: targetText })

                        <div className="text-[11px] text-emerald-300">Saved in [Gmail]/Drafts with Abhishek_Anand_Resume.pdf attached.</div>
                      </div>
                    </div>
                    <a
                      href="https://mail.google.com/mail/#drafts"
                      target="_blank"
                      rel="noopener noreferrer"
                      className="px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-[11px] transition inline-flex items-center gap-1">
                      Open Drafts ↗
                    </a>
                  </div>
                )}

                {sendResult && (
                  <div className="p-3 rounded-xl bg-blue-950/60 border border-blue-500/40 text-blue-300 text-xs flex items-center gap-2">
                    <span>🚀</span>
                    <span>{sendResult.message}</span>
                  </div>
                )}

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-400 font-medium mb-1">To (Recruiter / Hiring Email):</label>
                    <input
                      type="email"
                      value={emailTo}
                      onChange={e => setEmailTo(e.target.value)}
                      placeholder="e.g. careers@company.com or recruiter@company.com"
                      className="w-full bg-slate-900 border border-white/10 rounded-xl p-2.5 text-white focus:outline-none focus:border-brand-500 font-mono text-xs"
                    />
                  </div>

                  <div>
                    <label className="block text-slate-400 font-medium mb-1">Subject:</label>
                    <input
                      type="text"
                      value={emailSubject}
                      onChange={e => setEmailSubject(e.target.value)}
                      className="w-full bg-slate-900 border border-white/10 rounded-xl p-2.5 text-white focus:outline-none focus:border-brand-500 text-xs font-semibold"
                    />
                  </div>

                  <div className="flex items-center gap-2 p-2 rounded-xl bg-slate-900/80 border border-white/5 text-[11px] text-emerald-400 font-mono">
                    <span>📎</span>
                    <span>Attached: Abhishek_Anand_Resume.pdf (ATS Validated, 3.5+ Yrs Frontend)</span>
                  </div>

                  <div>
                    <label className="block text-slate-400 font-medium mb-1">Email Body (Tailored Cover Letter):</label>
                    <textarea
                      rows="7"
                      value={emailBody}
                      onChange={e => setEmailBody(e.target.value)}
                      className="w-full bg-slate-900 border border-white/10 rounded-xl p-3 text-white focus:outline-none focus:border-brand-500 text-xs font-mono leading-relaxed custom-scrollbar"
                    ></textarea>
                  </div>
                </div>

                <div className="flex items-center gap-3 pt-1">
                  <button
                    onClick={handleSaveDraftToGmail}
                    disabled={savingDraft || !emailTo}
                    className="flex-1 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white font-semibold text-xs flex items-center justify-center gap-2 transition">
                    <span>💾</span>
                    <span>{savingDraft ? 'Saving to Gmail...' : 'Save to Gmail Drafts'}</span>
                  </button>

                  <a
                    href="https://mail.google.com/mail/#drafts"
                    target="_blank"
                    rel="noopener noreferrer"
                    className="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold text-xs transition inline-flex items-center gap-1.5 border border-white/10">
                    <span>↗</span>
                    <span>Open Gmail</span>
                  </a>

                  <button
                    onClick={handleSendEmailNow}
                    disabled={sendingEmail || !emailTo}
                    className="px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white font-semibold text-xs flex items-center gap-1.5 transition">
                    <span>🚀</span>
                    <span>{sendingEmail ? 'Sending...' : 'Send Now'}</span>
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // -------------------------------------------------------------------------
    // TAB 3: INDEED & DIRECT INTAKE (FEED / URL) & ITS 5 EXECUTION STAGES
    // -------------------------------------------------------------------------
    function DirectApplyView({ runStatus }) {
      const logs = (runStatus && Array.isArray(runStatus.logs)) ? runStatus.logs : [];
      const isRunning = Boolean(runStatus && runStatus.is_running);

      const [intakeMode, setIntakeMode] = useState('feed'); // 'feed' | 'url' | 'session'
      const [feedText, setFeedText] = useState('');
      const [feedResult, setFeedResult] = useState(null);
      const [analyzingFeed, setAnalyzingFeed] = useState(false);

      const [url, setUrl] = useState('');
      const [urlResult, setUrlResult] = useState(null);
      const [analyzingUrl, setAnalyzingUrl] = useState(false);

      const [importPortal, setImportPortal] = useState('indeed');
      const [importRawText, setImportRawText] = useState('');
      const [importing, setImporting] = useState(false);
      const [importSuccess, setImportSuccess] = useState(null);

      const [visible, setVisible] = useState(false);
      const [detectedPortal, setDetectedPortal] = useState('Universal ATS');
      const [currentStage, setCurrentStage] = useState(1);
      const [executionStatus, setExecutionStatus] = useState(null);
      const logContainerRef = useRef(null);

      useEffect(() => {
        const u = (url || '').toLowerCase();
        if (u.includes('indeed')) setDetectedPortal('Indeed India / Global');
        else if (u.includes('greenhouse')) setDetectedPortal('Greenhouse ATS');
        else if (u.includes('lever.co')) setDetectedPortal('Lever ATS');
        else if (u.includes('workday')) setDetectedPortal('Workday ATS');
        else if (u.includes('ashby')) setDetectedPortal('Ashby ATS');
        else if (u.includes('smartrecruiters')) setDetectedPortal('SmartRecruiters ATS');
        else if (u.includes('instahyre')) setDetectedPortal('Instahyre');
        else if (u.includes('naukri')) setDetectedPortal('Naukri Direct Apply');
        else if (u.includes('linkedin')) setDetectedPortal('LinkedIn Direct Apply');
        else setDetectedPortal('Universal ATS / Corporate Career Page');
      }, [url]);

      // Stage tracking based on logs
      useEffect(() => {
        if (isRunning && logs.length > 0) {
          const allText = logs.join(' ').toLowerCase();
          if (allText.includes('confirm') || allText.includes('receipt') || allText.includes('successfully applied')) {
            setCurrentStage(5);
            setExecutionStatus({ status: 'APPLIED', message: 'Application submitted and verified successfully!' });
          } else if (allText.includes('upload') || allText.includes('resume attached') || allText.includes('file')) {
            setCurrentStage(4);
          } else if (allText.includes('question') || allText.includes('screening') || allText.includes('solving')) {
            setCurrentStage(3);
          } else if (allText.includes('tailor') || allText.includes('generating') || allText.includes('pdf')) {
            setCurrentStage(2);
          } else {
            setCurrentStage(1);
          }
        }
      }, [logs, isRunning]);

      useEffect(() => {
        if (logContainerRef.current) {
          logContainerRef.current.scrollTop = logContainerRef.current.scrollHeight;
        }
      }, [logs]);

      const handleAnalyzeFeed = async () => {
        if (!feedText.trim()) return alert("Please paste a job alert message, email body, or notification snippet.");
        setAnalyzingFeed(true);
        setFeedResult(null);
        try {
          const res = await fetch('/api/intake/analyze-feed', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ feed_text: feedText })
          });
          const d = await res.json();
          if (d.success) {
            setFeedResult(d);
            if (d.extracted?.job_url) {
              setUrl(d.extracted.job_url);
            }
          } else {
            alert(d.error || "Analysis failed");
          }
        } catch (e) {
          alert("Error analyzing feed: " + e);
        } finally {
          setAnalyzingFeed(false);
        }
      };

      const handleAnalyzeUrl = async () => {
        if (!url.trim()) return alert("Please enter a valid job URL to analyze.");
        setAnalyzingUrl(true);
        setUrlResult(null);
        try {
          const res = await fetch('/api/intake/analyze-url', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: url.trim() })
          });
          const d = await res.json();
          if (d.success) {
            setUrlResult(d);
          } else {
            alert(d.error || "URL Analysis failed");
          }
        } catch (e) {
          alert("Error inspecting URL: " + e);
        } finally {
          setAnalyzingUrl(false);
        }
      };

      const handleApply = async (targetUrl) => {
        const toApply = targetUrl || url;
        if (!toApply) return alert("Please enter a job URL or analyze a feed containing a link");
        setExecutionStatus(null);
        setCurrentStage(1);
        try {
          const res = await fetch('/api/intake/apply', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: toApply, visible })
          });
          const d = await res.json();
          if (!d.success) alert(d.error);
        } catch (e) {
          alert("Error: " + e);
        }
      };

      const handleImportSession = async () => {
        if (!importRawText.trim()) return alert("Please paste a cURL command or Cookie JSON");
        setImporting(true);
        setImportSuccess(null);
        try {
          const res = await fetch('/api/session/import', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ portal: importPortal, data: importRawText.trim() })
          });
          const d = await res.json();
          if (d.success) {
            setImportSuccess(`Verified & imported ${d.cookie_count} cookies for ${d.portal.toUpperCase()}!`);
            setImportRawText('');
          } else {
            alert(d.error || "Import failed");
          }
        } catch (e) {
          alert("Error: " + e);
        } finally {
          setImporting(false);
        }
      };

      const stages = [
        { id: 1, name: "Detecting Portal / ATS", desc: "Indeed / Greenhouse / Lever / Workday" },
        { id: 2, name: "Tailoring Resume", desc: "Dynamic PDF matching JD keywords" },
        { id: 3, name: "Answering Questions", desc: "Smart screening & compliance solver" },
        { id: 4, name: "Uploading Resume", desc: "ATS-validated PDF attachment" },
        { id: 5, name: "Verified Receipt", desc: "Strict proof of application submission" }
      ];

      return (
        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
          {/* Controls & Mode Switcher */}
          <div className="glass-card p-6 rounded-2xl space-y-5 lg:col-span-1">
            <div>
              <div className="flex items-center justify-between">
                <h3 className="font-bold text-base text-white flex items-center gap-2">
                  <span>🎯</span> Indeed &amp; Direct Intake Hub
                </h3>
                <span className="text-[10px] px-2 py-0.5 rounded bg-brand-500/20 text-brand-300 font-mono">
                  AI Fit Evaluator
                </span>
              </div>
              <p className="text-xs text-slate-400 mt-1">
                Drop raw notification messages or direct job URLs for suitability analysis and 1-click apply.
              </p>
            </div>

            {/* Mode Switcher Tabs */}
            <div className="flex rounded-xl bg-slate-900/90 p-1 border border-white/10">
              <button
                onClick={() => setIntakeMode('feed')}
                className={`flex-1 py-1.5 rounded-lg text-xs font-semibold transition ${
                  intakeMode === 'feed' ? 'bg-brand-600 text-white shadow' : 'text-slate-400 hover:text-white'
                }`}>
                💬 Message Feed
              </button>
              <button
                onClick={() => setIntakeMode('url')}
                className={`flex-1 py-1.5 rounded-lg text-xs font-semibold transition ${
                  intakeMode === 'url' ? 'bg-brand-600 text-white shadow' : 'text-slate-400 hover:text-white'
                }`}>
                🔗 Direct Job URL
              </button>
              <button
                onClick={() => setIntakeMode('session')}
                className={`flex-1 py-1.5 rounded-lg text-xs font-semibold transition ${
                  intakeMode === 'session' ? 'bg-brand-600 text-white shadow' : 'text-slate-400 hover:text-white'
                }`}>
                🍪 Import Session
              </button>
            </div>

            {/* MODE 1: MESSAGE / EMAIL / NOTIFICATION FEED */}
            {intakeMode === 'feed' && (
              <div className="space-y-3.5">
                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1">
                    Paste Job Notification / Recruiter Message
                  </label>
                  <textarea
                    rows={4}
                    value={feedText}
                    onChange={e => setFeedText(e.target.value)}
                    placeholder="Paste hiring alert, email body, in-app notification snippet, or WhatsApp alert here... e.g.: Hiring React Developer (3-5 Yrs) at Razorpay in Bengaluru. Apply at https://in.indeed.com/viewjob?jk=..."
                    className="w-full bg-slate-900 border border-white/10 rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:border-brand-500 font-mono resize-none"
                  />
                </div>

                <div className="flex gap-2">
                  <button
                    disabled={analyzingFeed || !feedText.trim()}
                    onClick={handleAnalyzeFeed}
                    className="flex-1 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white font-bold text-xs shadow transition flex items-center justify-center gap-1.5">
                    <span>{analyzingFeed ? '⏳' : '🔍'}</span>
                    <span>{analyzingFeed ? 'Analyzing Suitability...' : 'Analyze Message & Check Fit'}</span>
                  </button>
                  {feedText && (
                    <button
                      onClick={() => { setFeedText(''); setFeedResult(null); }}
                      className="px-3 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-400 text-xs font-mono">
                      Clear
                    </button>
                  )}
                </div>

                {/* Analysis Outcome Card */}
                {feedResult && (
                  <div className="bg-slate-950 p-3.5 rounded-xl border border-white/10 space-y-2.5 text-xs font-mono">
                    <div className="flex items-center justify-between border-b border-white/10 pb-2">
                      <div>
                        <span className="font-bold text-white block text-sm">{feedResult.extracted?.role_title}</span>
                        <span className="text-slate-400 text-[11px]">{feedResult.extracted?.company} · {feedResult.extracted?.location}</span>
                      </div>
                      <span className={`px-2.5 py-1 rounded-full text-xs font-bold ${
                        feedResult.evaluation?.recommendation === 'APPLY' ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' :
                        feedResult.evaluation?.recommendation === 'REVIEW' ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30' :
                        'bg-rose-500/20 text-rose-300 border border-rose-500/30'
                      }`}>
                        {feedResult.evaluation?.score}% {feedResult.evaluation?.recommendation}
                      </span>
                    </div>

                    <p className="text-[11px] text-slate-300 leading-relaxed">
                      {feedResult.evaluation?.verdict}
                    </p>

                    {feedResult.evaluation?.matched_skills?.length > 0 && (
                      <div className="flex flex-wrap gap-1 pt-1">
                        {feedResult.evaluation.matched_skills.map((s, idx) => (
                          <span key={idx} className="px-1.5 py-0.5 rounded bg-emerald-950 text-emerald-300 text-[10px] border border-emerald-500/30">
                            ✓ {s}
                          </span>
                        ))}
                      </div>
                    )}

                    {feedResult.extracted?.job_url ? (
                      <div className="pt-2 border-t border-white/10 space-y-2">
                        <div className="text-[10px] text-slate-400 truncate">
                          <span className="text-slate-500">Target URL:</span> {feedResult.extracted.job_url}
                        </div>
                        <button
                          disabled={runStatus.is_running}
                          onClick={() => handleApply(feedResult.extracted.job_url)}
                          className="w-full py-2.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs transition shadow flex items-center justify-center gap-1.5">
                          <span>🚀</span> Apply to This Opportunity Now
                        </button>
                      </div>
                    ) : (
                      <div className="text-[10px] text-amber-400 pt-1">
                        ⚠️ No direct URL found in message. Paste the job URL in the 'Direct Job URL' tab to apply.
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}

            {/* MODE 2: DIRECT JOB URL */}
            {intakeMode === 'url' && (
              <div className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1.5">Direct Job URL</label>
                  <div className="relative">
                    <input
                      type="text"
                      value={url}
                      onChange={e => setUrl(e.target.value)}
                      placeholder="https://in.indeed.com/viewjob?jk=... or https://jobs.lever.co/..."
                      className="w-full bg-slate-900 border border-white/10 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-brand-500 font-mono pr-24"
                    />
                    {url && (
                      <span className="absolute right-2.5 top-2.5 px-2 py-0.5 rounded bg-brand-500/20 text-brand-300 text-[10px] font-mono border border-brand-500/30">
                        {detectedPortal}
                      </span>
                    )}
                  </div>
                </div>

                {/* Quick Presets */}
                <div className="space-y-1.5">
                  <span className="text-[11px] text-slate-400 font-medium">Quick Presets:</span>
                  <div className="flex flex-wrap gap-1.5">
                    <button onClick={() => setUrl('https://in.indeed.com/jobs?q=React+Developer&l=Bengaluru')} className="px-2 py-1 rounded bg-indigo-950/80 hover:bg-indigo-900 text-indigo-300 text-[10px] font-mono border border-indigo-500/30">Indeed India</button>
                    <button onClick={() => setUrl('https://boards.greenhouse.io/example/jobs/12345')} className="px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 text-[10px] font-mono">Greenhouse</button>
                    <button onClick={() => setUrl('https://jobs.lever.co/example/abcdef')} className="px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 text-[10px] font-mono">Lever</button>
                    <button onClick={() => setUrl('https://nvidia.wd5.myworkdayjobs.com/NVIDIAExternalCareerSite/job/India-Bengaluru/Senior-Frontend-Engineer_JR198542')} className="px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 text-[10px] font-mono">Workday (NVIDIA)</button>
                  </div>
                </div>

                <div className="flex gap-2">
                  <button
                    disabled={analyzingUrl || !url}
                    onClick={handleAnalyzeUrl}
                    className="flex-1 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold text-xs transition border border-white/10 flex items-center justify-center gap-1.5">
                    <span>{analyzingUrl ? '⏳' : '🔍'}</span>
                    <span>{analyzingUrl ? 'Inspecting Page...' : 'Inspect Page & Check Fit'}</span>
                  </button>
                </div>

                {/* Live URL Inspection Outcome */}
                {urlResult && (
                  <div className="bg-slate-950 p-3 rounded-xl border border-white/10 space-y-2 text-xs font-mono">
                    <div className="flex items-center justify-between">
                      <span className="font-bold text-white truncate max-w-[180px]">{urlResult.details?.title}</span>
                      <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                        urlResult.evaluation?.score >= 70 ? 'bg-emerald-500/20 text-emerald-300' : 'bg-amber-500/20 text-amber-300'
                      }`}>
                        {urlResult.evaluation?.score}% Match
                      </span>
                    </div>
                    <div className="text-[11px] text-slate-400">
                      {urlResult.details?.company} · {urlResult.details?.location}
                    </div>
                    <div className="text-[10px] text-indigo-300 bg-indigo-950/40 p-1.5 rounded border border-indigo-500/20">
                      Mode: {urlResult.apply_mode || "Automated Flow"}
                    </div>
                  </div>
                )}

                <div className="flex items-center gap-2 pt-1">
                  <input type="checkbox" id="visibleDirect" checked={visible} onChange={e => setVisible(e.target.checked)} className="rounded border-white/10 text-brand-600 focus:ring-0" />
                  <label htmlFor="visibleDirect" className="text-xs text-slate-300">Visible Browser (Watch stealth form filling)</label>
                </div>

                <button
                  disabled={runStatus.is_running || !url}
                  onClick={() => handleApply(url)}
                  className="w-full py-3.5 rounded-xl bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 disabled:opacity-50 text-white font-bold text-xs shadow-lg shadow-brand-500/25 transition flex items-center justify-center gap-2">
                  <span>⚡</span>
                  <span>Launch Direct Application</span>
                </button>
              </div>
            )}

            {/* MODE 3: DIRECT SESSION / COOKIE IMPORTER */}
            {intakeMode === 'session' && (
              <div className="space-y-4">
                <div className="bg-slate-950 p-3.5 rounded-xl border border-white/10 space-y-2.5">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-bold text-emerald-400 flex items-center gap-1.5">
                      <span>🍪</span> 100% Anti-Bot Cloudflare Bypass Importer
                    </span>
                    <select
                      value={importPortal}
                      onChange={e => setImportPortal(e.target.value)}
                      className="bg-slate-900 border border-white/10 rounded px-2 py-1 text-xs text-white font-mono">
                      <option value="indeed">Indeed</option>
                      <option value="naukri">Naukri</option>
                      <option value="linkedin">LinkedIn</option>
                      <option value="instahyre">Instahyre</option>
                    </select>
                  </div>
                  <p className="text-[11px] text-slate-300 leading-relaxed">
                    Cloudflare or Captchas blocking automated login? Import your active session directly from your normal browser in 3 easy steps:
                  </p>
                  <ol className="text-[10px] text-slate-400 space-y-1 list-decimal list-inside font-mono">
                    <li>In your regular Chrome, log in to <b>{importPortal}.com</b> normally.</li>
                    <li>Press <span className="text-white bg-slate-900 px-1 rounded">Cmd + Opt + I</span> → <b>Network</b> tab → Refresh page (<span className="text-white bg-slate-900 px-1 rounded">Cmd + R</span>).</li>
                    <li>Right-click the top network request → <b>Copy</b> → <b>Copy as cURL</b>.</li>
                  </ol>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1">
                    Paste cURL or Cookie-Editor JSON:
                  </label>
                  <textarea
                    rows={4}
                    value={importRawText}
                    onChange={e => setImportRawText(e.target.value)}
                    placeholder="Paste full 'curl https://...' command or Cookie-Editor JSON array here..."
                    className="w-full bg-slate-900 border border-white/10 rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:border-brand-500 font-mono resize-none"
                  />
                </div>

                <button
                  disabled={importing || !importRawText.trim()}
                  onClick={handleImportSession}
                  className="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white font-bold text-xs shadow-lg shadow-emerald-500/20 transition flex items-center justify-center gap-2">
                  <span>📥</span>
                  <span>{importing ? 'Importing Session...' : `Save Authenticated ${importPortal.toUpperCase()} Session`}</span>
                </button>

                {importSuccess && (
                  <div className="bg-emerald-950/80 p-3 rounded-xl border border-emerald-500/30 text-emerald-300 text-xs font-mono flex items-center gap-2">
                    <span>✓</span>
                    <span>{importSuccess}</span>
                  </div>
                )}
              </div>
            )}

            {/* Active Stepper Visualizer */}
            <div className="border-t border-white/10 pt-4 space-y-3">
              <h4 className="text-xs font-semibold text-slate-300">Execution Stepper (5 Stages):</h4>
              <div className="space-y-2">
                {stages.map(s => {
                  const isActive = runStatus.is_running && currentStage === s.id;
                  const isDone = currentStage > s.id;
                  return (
                    <div key={s.id} className={`p-2.5 rounded-xl border flex items-center gap-3 transition ${
                      isActive ? 'bg-brand-950/60 border-brand-500/60 stepper-active text-white' :
                      isDone ? 'bg-emerald-950/30 border-emerald-500/30 text-emerald-300' :
                      'bg-slate-900/40 border-white/5 text-slate-500'
                    }`}>
                      <div className={`w-6 h-6 rounded-full flex items-center justify-center font-mono text-xs font-bold ${

    // -------------------------------------------------------------------------
    // TAB 4: GOOGLE SHEET 'APPLY YOURSELF' BATCH RUNNER
    // -------------------------------------------------------------------------
    function GoogleSheetsBatchRunnerView({ sheetsData, loading, reload, runStatus }) {
      const [limit, setLimit] = useState(10);
      const [roleFilter, setRoleFilter] = useState('');
      const [visible, setVisible] = useState(false);
      const [launchingBatch, setLaunchingBatch] = useState(false);
      const [statusOverrideModal, setStatusOverrideModal] = useState({ open: false, row: null, status: 'APPLIED', reason: '' });
      const [batchOutcome, setBatchOutcome] = useState(null);

      const fetchOutcome = async () => {
        try {
          const res = await fetch('/api/google-sheets/batch-outcome');
          const d = await res.json();
          if (d.success && d.outcome) {
            setBatchOutcome(d.outcome);
          }
        } catch (e) {}
      };

      useEffect(() => {
        fetchOutcome();
      }, []);

      const handleBatchApply = async () => {
        setLaunchingBatch(true);
        try {
          const res = await fetch('/api/google-sheets/batch-apply', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ limit, role: roleFilter, visible })
          });
          const d = await res.json();
          if (d.success) {
            alert(`🚀 Sheet Batch Apply launched! Processing up to ${limit} pending jobs. Watch the live console banner above.`);
            setTimeout(fetchOutcome, 5000);
          } else {
            alert(d.error || "Could not launch batch run");
          }
        } catch (e) {
          alert("Error: " + e);
        } finally {
          setLaunchingBatch(false);
        }
      };

      const handleApplySingleRow = async (row) => {
        try {
          const res = await fetch('/api/google-sheets/apply', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              row_index: row.row_index,
              url: row.direct_apply_url,
              company: row.company,
              title: row.job_title,
              resume_path: row.tailored_resume_path
            })
          });
          const d = await res.json();
          alert(d.message || "Launched application for row #" + row.row_index);
        } catch (e) {
          alert("Error: " + e);
        }
      };

      const handleStatusOverride = async () => {
        if (!statusOverrideModal.row) return;
        try {
          const res = await fetch('/api/google-sheets/update-status', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              url: statusOverrideModal.row.direct_apply_url,
              row_index: statusOverrideModal.row.row_index,
              status: statusOverrideModal.status,
              reason: statusOverrideModal.reason
            })
          });
          const d = await res.json();
          if (d.success) {
            alert("Updated Column 10 in Google Sheet to: " + statusOverrideModal.status);
            setStatusOverrideModal({ open: false, row: null, status: 'APPLIED', reason: '' });
            reload();

            alert(d.error || "Failed to update status");

          alert("Error: " + e);

      if (loading) return <div className="text-xs text-slate-400 p-8 text-center">Syncing live records with Google Sheets 'Apply Yourself' tab...</div>;

      const jobs = sheetsData?.jobs || [];
      const pendingCount = sheetsData?.stats?.pending || 0;

        <div className="space-y-6">

                  <span>⚡</span>
                  <span>{runStatus.is_running ? 'Batch Task Running...' : `Auto-Apply Pending Sheet Jobs (${limit} Batch)`}</span>
                </button>
              </div>
            </div>
          </div>

          {/* Dedicated Transparent Post-Batch Outcome Card */}
          {batchOutcome && (
            <div className={`p-5 rounded-2xl border ${

              <div className="flex flex-wrap items-center justify-between gap-2 border-b border-white/10 pb-3">
                <div className="flex items-center gap-2">
                  <span className="text-2xl">{batchOutcome.unapplied_count > 0 ? '⚠️' : '🎉'}</span>
                  <div>
                    <h4 className="font-bold text-sm text-white">

              {batchOutcome.unapplied_jobs?.length > 0 && (

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-2.5 max-h-64 overflow-y-auto custom-scrollbar">

                        <a

                        >
                          <span>🔗</span> Apply Yourself
                        </a>
                      </div>
                    ))}
                  </div>
                </div>

            </div>

          {/* Sheet KPI Statistics */}
          <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div className="glass-card p-4 rounded-2xl">
              <span className="text-[11px] font-medium text-slate-400">Total Rows in Sheet</span>
              <div className="text-2xl font-bold text-white">{totalCount}</div>
              <span className="text-[11px] text-slate-400 font-mono">Column 1 to 10 mapped</span>

              <div className="text-2xl font-bold text-emerald-300">{appliedCount}</div>

                  <span>📋</span> Live Sheet Records: 'Apply Yourself' Tab
                </h3>
                <p className="text-[11px] text-slate-400 font-mono mt-0.5">Spreadsheet ID: 15EFmeEcqtEJNqYDSYdL755534yc9RHqIsiIm7COa94I</p>
              </div>
              <span className="text-xs text-slate-400 font-mono">Showing {jobs.length} total rows</span>

    // -------------------------------------------------------------------------
    // TAB 5: VERIFIED APPLICATIONS LEDGER (Zero False Inflation Guarantee)
    // -------------------------------------------------------------------------
    function VerifiedLedgerView({ recentApps, metrics }) {
      const [filterStatus, setFilterStatus] = useState('ALL_VERIFIED');
      const [filterPlat, setFilterPlat] = useState('all');
      const [search, setSearch] = useState('');

      const filtered = recentApps.filter(a => {
        if (filterPlat !== 'all' && !a.platform.includes(filterPlat)) return false;
        
        if (filterStatus === 'APPLIED_ONLY') {
          if (!['APPLIED', 'EXTERNAL_APPLIED'].includes(a.status)) return false;
        } else if (filterStatus === 'PENDING_ONLY') {
          if (!a.status.includes('PENDING')) return false;
        } else if (filterStatus === 'REVIEW_ONLY') {
          if (a.status !== 'REVIEW_REQUIRED' && a.status !== 'UNCERTAIN') return false;
        } else if (filterStatus === 'SKIPPED_ONLY') {
          if (a.status !== 'SKIPPED') return false;
        }

        if (search) {
          const s = search.toLowerCase();
          return a.company.toLowerCase().includes(s) || a.title.toLowerCase().includes(s) || a.reason.toLowerCase().includes(s);
        }
        return true;
      });

      return (
        <div className="space-y-6">
          {/* Zero False Inflation Explanation Banner */}
          <div className="glass-card p-5 rounded-2xl border border-emerald-500/30 bg-emerald-950/20 space-y-2">
            <div className="flex items-center justify-between">
              <h3 className="font-bold text-sm text-white flex items-center gap-2">
                <span>📜</span> Verified Applications Ledger &amp; Transparent Breakdown
              </h3>
              <span className="text-xs px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 font-mono">
                Zero False Positives Guaranteed
              </span>
            </div>
            <p className="text-xs text-slate-300 leading-relaxed">
              We eliminated the vague 21,788 count. In this verified ledger, we explicitly separate <strong>Submitted Applications (225 Verified Easy Apply / {metrics.ledger?.total_processed_records || 572} Total Processed)</strong> from <strong>Pending Sheet Jobs ({metrics.google_sheets?.pending || 0})</strong>, <strong>Review Required ({metrics.google_sheets?.review_required || 0})</strong>, and <strong>Filtered Search Cards (19,723)</strong> which were skipped during candidate matching due to senior YoE (&gt;6 yrs) or location filters.
            </p>
          </div>

          {/* Quick Segment Filter Pills */}
          <div className="flex flex-wrap items-center gap-2">
            <button
              onClick={() => setFilterStatus('ALL_VERIFIED')}
              className={`px-3 py-1.5 rounded-xl text-xs font-semibold transition ${filterStatus === 'ALL_VERIFIED' ? 'bg-brand-600 text-white' : 'bg-slate-900 text-slate-400 hover:text-white border border-white/5'}`}>
              All Verified Records ({recentApps.length})
            </button>
            <button
              onClick={() => setFilterStatus('APPLIED_ONLY')}
              className={`px-3 py-1.5 rounded-xl text-xs font-semibold transition ${filterStatus === 'APPLIED_ONLY' ? 'bg-emerald-600 text-white' : 'bg-slate-900 text-slate-400 hover:text-white border border-white/5'}`}>
              ✅ Submitted Only ({recentApps.filter(a => ['APPLIED', 'EXTERNAL_APPLIED'].includes(a.status)).length})
            </button>
            <button
              onClick={() => setFilterStatus('PENDING_ONLY')}
              className={`px-3 py-1.5 rounded-xl text-xs font-semibold transition ${filterStatus === 'PENDING_ONLY' ? 'bg-amber-600 text-white' : 'bg-slate-900 text-slate-400 hover:text-white border border-white/5'}`}>
              ⏳ Pending Sheet Jobs ({metrics.google_sheets?.pending || 0})
            </button>
            <button
              onClick={() => setFilterStatus('REVIEW_ONLY')}
              className={`px-3 py-1.5 rounded-xl text-xs font-semibold transition ${filterStatus === 'REVIEW_ONLY' ? 'bg-cyan-600 text-white' : 'bg-slate-900 text-slate-400 hover:text-white border border-white/5'}`}>
              ⚠️ Review Required ({metrics.google_sheets?.review_required || 0})
            </button>
            <button
              onClick={() => setFilterStatus('SKIPPED_ONLY')}
              className={`px-3 py-1.5 rounded-xl text-xs font-semibold transition ${filterStatus === 'SKIPPED_ONLY' ? 'bg-slate-700 text-white' : 'bg-slate-900 text-slate-400 hover:text-white border border-white/5'}`}>

                type="text"
                placeholder="Search by role, company, or reason..."
                value={search}
                onChange={e => setSearch(e.target.value)}
                className="bg-slate-900 border border-white/10 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-brand-500 w-72"
              />
              <select
                value={filterPlat}
                onChange={e => setFilterPlat(e.target.value)}
                className="bg-slate-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-brand-500">
                <option value="all">All Platforms</option>
                <option value="naukri">Naukri</option>
                <option value="linkedin">LinkedIn</option>
                <option value="instahyre">Instahyre</option>
                <option value="direct_ats">Direct ATS</option>
                <option value="google_sheets">Google Sheets</option>
              </select>
            </div>
            <div className="text-xs text-slate-400 font-mono">
              Showing {filtered.length} entries
            </div>
          </div>

          {/* Ledger Table */}
          <div className="glass-card rounded-2xl overflow-hidden border border-white/10">
            <div className="overflow-x-auto max-h-[550px] custom-scrollbar">
              <table className="w-full text-left text-xs">
                <thead className="bg-slate-950 text-slate-400 font-mono sticky top-0 border-b border-white/5">
                  <tr>
                    <th className="px-4 py-3">Timestamp</th>
                    <th className="px-4 py-3">Platform</th>
                    <th className="px-4 py-3">Company &amp; Role</th>
                    <th className="px-4 py-3">Status</th>
                    <th className="px-4 py-3">Details / Reason / Job Link</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-white/5">
                  {filtered.map((r, i) => (
                    <tr key={i} className="hover:bg-white/[0.02]">
                      <td className="px-4 py-2.5 font-mono text-slate-500 whitespace-nowrap">{r.timestamp?.slice(0, 16)}</td>
                      <td className="px-4 py-2.5 font-mono text-slate-300">{r.platform}</td>
                      <td className="px-4 py-2.5">
                        <div className="font-semibold text-white">{r.title}</div>
                        <span className="text-slate-400">{r.company}</span>
                      </td>
                      <td className="px-4 py-2.5">
                        <span className={`px-2 py-0.5 rounded text-[10px] font-mono font-semibold ${
                          ['APPLIED', 'EXTERNAL_APPLIED'].includes(r.status) ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' :
                          r.status.includes('PENDING') ? 'bg-amber-500/10 text-amber-300 border border-amber-500/20' :
                          r.status === 'REVIEW_REQUIRED' ? 'bg-cyan-500/10 text-cyan-300 border border-cyan-500/20' :
                          r.status === 'SKIPPED' ? 'bg-slate-800 text-slate-400' :
                          'bg-slate-800 text-slate-400'
                        }`}>
                          {r.status}
                        </span>
                      </td>
                      <td className="px-4 py-2.5 text-slate-400 max-w-sm truncate">
                        {r.url ? (
                          <a href={r.url} target="_blank" rel="noreferrer" className="text-brand-400 hover:underline font-mono text-[11px] mr-2">
                            Link ↗
                          </a>
                        ) : null}
                        <span>{r.reason || 'Verified application logged'}</span>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // Render the React App into the root container
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
