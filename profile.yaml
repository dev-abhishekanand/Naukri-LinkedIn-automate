work_history_narrative: |
  Software Engineer with 3.6 years of professional experience focused on frontend development using React, Next.js, TypeScript and JavaScript. Experienced in building scalable web applications and working with REST APIs, GraphQL, state management and modern frontend tooling. Currently available immediately for a new opportunity.

company_exclude: [] # e.g. ["Your Current Employer"] -- filter rule, not a fact
company_include_only: [] # leave empty to not restrict

seniority_floor_years: 0
seniority_ceiling_years: 5
job_freshness_days: 2 # Naukri's "freshness" filter -- only jobs posted in the last N days

salary_floor_lpa: null

stop_after_n_applications: 5
pace_seconds_between_actions: 30

# How long to wait for you to type an answer when the script hits a
# question it can't answer safely on its own (personal details like DOB,
# or anything the AI genuinely doesn't know from your profile). If you
# don't respond in time, that one listing is skipped -- the run continues.
human_input_timeout_seconds: 120

# How many search-result pages to go through per role before moving to the
# next role (or stopping, if stop_after_n_applications is reached first).
max_pages_per_role: 5

# How the browser window behaves while running:
#   "visible"   -- normal window, you can watch it (best for early runs / debugging)
#   "minimized" -- a real browser still opens and does everything the same way,
#                  but starts minimized to the taskbar so it's out of your way
#   "headless"  -- no window at all, fastest, but a genuinely fake/invisible
#                  browser is somewhat easier for a site to detect as a bot
#                  than a real (even minimized) one -- slightly higher risk
browser_mode: "minimized"

resume_file_name: "Abhishek_Anand_Resume.docx" # must match the filename already uploaded to Naukri/LinkedIn, and sit in this same project folder
