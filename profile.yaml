# ==========================================================================
# JOB GUARDRAILS & GHOST LISTING FILTRATION
# Automatically drops ghost postings, lowball compensation, and spam agencies.
# ==========================================================================
job_guardrails:
  max_age_days: 14       # Skip listings posted > 14 days ago
  min_ctc_lpa: 8.0       # Skip listings explicitly offering < 8.0 LPA
  blacklisted_companies:
    - "cybercoders"
    - "robert half"
    - "teksystems"
    - "apex systems"
    - "collabera"
    - "compunnel"
  blacklisted_keywords:
    - "unpaid"
    - "internship"
    - "freshers only"
    - "0-1 years"
    - "junior only"
    - "embedded c++"





