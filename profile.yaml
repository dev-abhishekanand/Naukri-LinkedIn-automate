# Controls how strictly a job's title must match the role you searched for.
# Naukri's own search is loose (e.g. "Data Engineer" can surface completely
# unrelated titles), so this filter re-checks the title itself. A card is
# kept only if its title contains at least one of these words. If a role
# isn't listed here, the script falls back to using the role's own words
# (minus generic terms like "engineer"/"developer").
role_required_keywords:
  "React Developer":
    [
      "react developer",
      "react engineer",
      "React.js Developer",
      "React JS Developer",
      "JavaScript Developer (React.js)",
      "React Js Frontend Developer",
      "Frontend Developer",
      "React Frrontend Developer",
    ]
  "Frontend Developer": ["frontend developer", "front end developer"]
  "Frontend Engineer": ["frontend engineer", "front end engineer"]
  "React + TypeScript Developer": ["react", "typescript"]
  "Next.js Developer": ["next.js", "nextjs"]
  "Full Stack JavaScript Developer":
    ["full stack", "fullstack", "MERN", "MERN fullstack Developer"]

