[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:xvfb]
command=Xvfb :99 -screen 0 1366x768x24 -ac +extension GLX +render -noreset
autorestart=true
priority=10

[program:x11vnc]
command=x11vnc -display :99 -forever -shared -nopw -rfbport 5900
autorestart=true
priority=20

[program:novnc]
command=websockify --web /usr/share/novnc 6080 localhost:5900
autorestart=true
priority=30

[program:dashboard_server]
command=python3 server.py --port 8585
directory=/app
autorestart=true
priority=40
stdout_logfile=/var/log/server_stdout.log
stderr_logfile=/var/log/server_stderr.log
