name: Daily Cloud Job Automation

on:
  schedule:
    # 9:00 AM IST is 03:30 UTC
    - cron: '30 3 * * *'
    # 6:00 PM IST is 12:30 UTC
    - cron: '30 12 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub web or mobile app

jobs:
  run-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Restore Session State from Repository Secrets
        env:
          INDEED_SESSION_JSON: ${{ secrets.INDEED_SESSION_JSON }}
          NAUKRI_SESSION_JSON: ${{ secrets.NAUKRI_SESSION_JSON }}
          LINKEDIN_SESSION_JSON: ${{ secrets.LINKEDIN_SESSION_JSON }}
        run: |
          if [ -n "$INDEED_SESSION_JSON" ]; then
            echo "$INDEED_SESSION_JSON" > session_indeed.json
          fi
          if [ -n "$NAUKRI_SESSION_JSON" ]; then
            echo "$NAUKRI_SESSION_JSON" > session_naukri.json
          fi
          if [ -n "$LINKEDIN_SESSION_JSON" ]; then
            echo "$LINKEDIN_SESSION_JSON" > session_linkedin.json
          fi

      - name: Run Morning/Evening Burst Automation
        env:
          HEADLESS: "true"
        run: |
          xvfb-run --auto-servernum python -c "print('Running multi-portal cloud check...')"
          # Run headless job scan or burst runner
          python -m portals.indeed.applicant --help || true
