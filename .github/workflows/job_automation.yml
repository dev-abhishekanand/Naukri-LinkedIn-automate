name: AI Job Automation Cloud Runner

on:
  schedule:
    # 09:00 AM IST (03:30 UTC) - Morning Freshness & Job Application Burst
    - cron: '30 3 * * 1-5'
    # 06:00 PM IST (12:30 UTC) - Evening Recruiter Inbox & Status Sync
    - cron: '30 12 * * 1-5'

  workflow_dispatch:
    inputs:
      task:
        description: 'Action to execute'
        required: true
        default: 'morning_burst'
        type: choice
        options:
          - morning_burst
          - evening_burst
          - refresh_profiles
          - apply_by_url
          - portal_apply
          - test_run
      portal:
        description: 'Target portal (for portal_apply)'
        required: false
        default: 'indeed'
        type: choice
        options:
          - indeed
          - naukri
          - linkedin
          - instahyre
      job_url:
        description: 'Job URL to apply for (for apply_by_url)'
        required: false
        default: ''
      limit:
        description: 'Max applications per portal'
        required: false
        default: '5'

jobs:
  run-job-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install system packages & virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth
          pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 🔐 Restore Authentication Sessions from Secrets
        env:
          INDEED_SESSION_JSON: ${{ secrets.INDEED_SESSION_JSON }}
          NAUKRI_SESSION_JSON: ${{ secrets.NAUKRI_SESSION_JSON }}
          LINKEDIN_SESSION_JSON: ${{ secrets.LINKEDIN_SESSION_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$INDEED_SESSION_JSON" ]; then
            echo "$INDEED_SESSION_JSON" > session_indeed.json
            echo "✓ session_indeed.json restored"
          fi
          if [ -n "$NAUKRI_SESSION_JSON" ]; then
            echo "$NAUKRI_SESSION_JSON" > session_naukri.json
            echo "✓ session_naukri.json restored"
          fi
          if [ -n "$LINKEDIN_SESSION_JSON" ]; then
            echo "$LINKEDIN_SESSION_JSON" > session_linkedin.json
            echo "✓ session_linkedin.json restored"
          fi
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env
            echo "✓ GEMINI_API_KEY set"
          fi

      - name: 🚀 Execute Automation Task
        env:
          HEADLESS: "true"
          PYTHONPATH: "."
          TASK: ${{ github.event.inputs.task || 'morning_burst' }}
          PORTAL: ${{ github.event.inputs.portal || 'indeed' }}
          JOB_URL: ${{ github.event.inputs.job_url }}
          LIMIT: ${{ github.event.inputs.limit || '5' }}
        run: |
          echo "=========================================================="
          echo "🤖 Running Automation: $TASK at $(date)"
          echo "=========================================================="

          case "$TASK" in
            "test_run")
              python main.py status || true
              python main.py test-solver || true
              ;;

            "refresh_profiles")
              xvfb-run --auto-servernum python naukri_update_headline.py || true
              xvfb-run --auto-servernum python linkedin_update_headline.py || true
              ;;

            "apply_by_url")
              if [ -z "$JOB_URL" ]; then
                echo "❌ Error: JOB_URL is required for apply_by_url task"
                exit 1
              fi
              xvfb-run --auto-servernum python main.py apply --url "$JOB_URL"
              ;;

            "portal_apply")
              echo "Applying on portal: $PORTAL (Limit: $LIMIT)..."
              xvfb-run --auto-servernum python main.py run --portal "$PORTAL" --limit "$LIMIT" || true
              ;;

            "morning_burst")
              echo "[1/3] Refreshing Naukri and LinkedIn headlines..."
              xvfb-run --auto-servernum python naukri_update_headline.py || true
              xvfb-run --auto-servernum python linkedin_update_headline.py || true

              echo "[2/3] Running Indeed Auto-Apply..."
              xvfb-run --auto-servernum python main.py run --portal indeed --limit "$LIMIT" || true

              echo "[3/3] Checking status..."
              python main.py status || true
              ;;

            "evening_burst")
              echo "[1/2] Checking Recruiter Inbox & Meetings..."
              python recruiter_meeting_detector.py || true
              python recruiter_inbox_manager.py || true

              echo "[2/2] Evening status summary..."
              python main.py status || true
              ;;

            *)
              echo "Unknown task: $TASK"
              exit 1
              ;;
          esac

      - name: 📊 Upload Run Logs & Application Tracker Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-run-logs-${{ github.run_number }}
          path: |
            applications_log.csv
            scheduler_logs/*.log
            *.png
          if-no-files-found: ignore
